version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: rucher_postgres
    restart: always
    environment:
      POSTGRES_USER: rucher_user
      POSTGRES_PASSWORD: rucher_password
      POSTGRES_DB: rucher_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
